<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            height: 230px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 5px;
        }

        .item {
            background-color: #ffda85;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }

        .item2,
        .item4,
        .item6 {
            background-color: #ed4167;
        }

        .item1 {
            grid-column: 1 / 5;
        }

        .item2 {
            grid-column: 1;
            grid-row: 2;
        }

        .item3 {
            grid-column: 2 / 4;
            grid-row: 2 / 4;
        }

        .item4 {
            grid-column: 4;
            grid-row: 2;
        }

        .item5 {
            grid-column: 1;
            grid-row: 3 / 5;
        }

        .item6 {
            grid-column: 4;
            grid-row: 3;
        }

        .item7 {
            grid-column: 2 / 5;
            grid-row: 4;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
        <div class="item item5">5</div>
        <div class="item item6">6</div>
        <div class="item item7">7</div>

    </div>

</body>
</html>
